name: Deploy Frontend to S3
# Frontend deploy pipeline (auto on main for frontend paths)

on:
  push:
    branches: ["main"]
    paths:
      - "Agenchq/resources/**"
      - "Agenchq/package.json"
      - "Agenchq/package-lock.json"
      - "Agenchq/vite.config.js"
      - "Agenchq/index.html"
      - "Agenchq/scripts/build-index.mjs"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: agenchq-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E16JXL5MNZFIYK

jobs:
  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "Agenchq/package-lock.json"

      - name: Install dependencies
        working-directory: Agenchq
        run: npm ci

      - name: Build frontend assets
        working-directory: Agenchq
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS deploy identity
        run: aws sts get-caller-identity

      - name: Upload frontend assets to S3
        run: |
          set -e
          if aws s3 sync Agenchq/public/build s3://${{ env.S3_BUCKET }} --delete; then
            echo "S3 sync with delete completed."
          else
            echo "Fallback #1: non-delete recursive upload."
            if aws s3 cp Agenchq/public/build s3://${{ env.S3_BUCKET }} --recursive; then
              echo "Fallback #1 succeeded."
            else
              echo "Fallback #2: retry with SSE-S3 header for buckets enforcing encryption."
              aws s3 cp Agenchq/public/build s3://${{ env.S3_BUCKET }} --recursive --sse AES256
            fi
          fi

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
