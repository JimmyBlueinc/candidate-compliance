name: Deploy to Amazon ECR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: agencyhq-repo-prod
  ECS_CLUSTER: agencyhq-cluster-prod
  ECS_SERVICE: agencyhq-service-prod
  SHORT_SHA: ${{ github.sha }}

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Push
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registries: "051826802625"

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: 051826802625.dkr.ecr.us-east-1.amazonaws.com
        ECR_REPOSITORY: agencyhq-repo-prod
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build the docker container and push it to ECR
        cd backend
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Deploy to Amazon ECS (force new deployment)
      run: |
        aws ecs update-service \
          --region $AWS_REGION \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --force-new-deployment

    - name: Wait for ECS service stability
      run: |
        aws ecs wait services-stable \
          --region $AWS_REGION \
          --cluster $ECS_CLUSTER \
          --services $ECS_SERVICE
